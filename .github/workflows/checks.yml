name: Skill and plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin metadata
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          test -f skills/bazi-inference/SKILL.md
      - name: Run runtime and maintainer checks
        run: python maintainer/run_checks.py
  ziwei:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked optional dependencies
        working-directory: skills/bazi-inference
        run: npm ci --ignore-scripts
      - name: Verify Ziwei adapter with public and synthetic cases
        working-directory: skills/bazi-inference
        run: npm run test:ziwei
